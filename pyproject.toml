[project]
name = "gutter-macro"
version = "0.1.0"
description = "Gutter Macro Dashboard — tracking AI's footprint in the real economy"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gutter_macro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
